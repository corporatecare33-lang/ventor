<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">LeatherX logo</title>
  <desc id="desc">Premium LeatherX wordmark with a dark leather tag monogram and antique gold accent.</desc>
  <defs>
    <linearGradient id="tagLeather" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#302018"/>
      <stop offset="0.45" stop-color="#16110f"/>
      <stop offset="1" stop-color="#4b2a18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6d889"/>
      <stop offset="0.42" stop-color="#c9953d"/>
      <stop offset="1" stop-color="#7a4d18"/>
    </linearGradient>
    <linearGradient id="wordGold" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#b2762d"/>
      <stop offset="0.5" stop-color="#e1b35d"/>
      <stop offset="1" stop-color="#9b641f"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1b0e08" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <path d="M90 61h178c26 0 47 21 47 47v166c0 26-21 47-47 47H90c-26 0-47-21-47-47V108c0-26 21-47 47-47Z" fill="url(#tagLeather)"/>
    <path d="M104 82h150c21 0 39 18 39 39v139c0 21-18 39-39 39H104c-21 0-39-18-39-39V121c0-21 18-39 39-39Z" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" stroke-dasharray="3 18"/>
    <path d="M96 53c0-20 16-36 36-36h92c20 0 36 16 36 36v8H96v-8Z" fill="url(#tagLeather)" stroke="#b98335" stroke-width="5"/>
    <text x="179" y="226" text-anchor="middle" fill="url(#gold)" font-family="Georgia, 'DejaVu Serif', serif" font-size="118" font-weight="700" letter-spacing="-10">LX</text>
    <path d="M116 255c31 20 91 21 126 0" fill="none" stroke="#c9953d" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  </g>

  <g>
    <text x="375" y="181" fill="#221711" font-family="'DejaVu Sans', Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-3">Leather</text>
    <text x="748" y="181" fill="url(#wordGold)" font-family="'DejaVu Sans', Arial, sans-serif" font-size="108" font-weight="900" letter-spacing="-6">X</text>
    <path d="M382 214h456" stroke="url(#wordGold)" stroke-width="7" stroke-linecap="round"/>
    <text x="382" y="264" fill="#6f5542" font-family="'DejaVu Sans', Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="8">PREMIUM LEATHER GOODS</text>
  </g>
</svg>
